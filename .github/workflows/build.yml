name: Build & verify site

# Rebuilds docs/ (production) and preview/ (GitHub Pages preview) whenever the
# catalog data, templates or config change, verifies them, and commits the
# result. data/ is the source of truth — there is no external sync.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'src/**', 'site.config.mjs', 'data/**', 'package*.json']

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build production site (docs/)
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          GA4_ID: ${{ vars.GA4_ID }}
        run: npm run build

      - name: Verify (links, titles, canonicals, JSON-LD, no Shopify / chat)
        run: npm run verify

      - name: Build preview (preview/), if present
        run: |
          if [ -d preview ]; then npm run build:preview && cp preview/404.html 404.html; fi

      - name: Commit changes
        run: |
          git config user.name "oshascorm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs preview 404.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: rebuild site [skip ci]"
            git push
          fi
