name: Sync catalog & build site

# Keeps the static site in step with Shopify (the source of truth for
# products, prices and courses):
#   • daily: pull the latest catalog, rebuild, verify, commit if anything changed
#   • on push to main: rebuild + verify so docs/ always matches the templates
# GitHub Pages serves the committed docs/ folder (Settings → Pages → main /docs).

on:
  schedule:
    - cron: '17 9 * * *' # daily, 09:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'src/**', 'site.config.mjs', 'data/**', 'package*.json']

permissions:
  contents: write

concurrency:
  group: sync-and-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Sync from Shopify
        if: github.event_name != 'push'
        run: npm run sync

      - name: Build
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          GA4_ID: ${{ vars.GA4_ID }}
        run: npm run build

      - name: Verify (links, titles, canonicals, JSON-LD)
        run: npm run verify

      - name: Commit changes
        run: |
          git config user.name "oshascorm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: sync catalog and rebuild site [skip ci]"
            git push
          fi

      # Optional: notify Bing/Yandex/others of changed URLs via IndexNow.
      # Set INDEXNOW_KEY (repo → Settings → Variables) to enable.
      - name: IndexNow ping
        if: vars.INDEXNOW_KEY != '' && github.event_name != 'push'
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: |
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json' \
            -d "{\"host\":\"oshascorm.org\",\"key\":\"$INDEXNOW_KEY\",\"urlList\":[\"https://oshascorm.org/\",\"https://oshascorm.org/sitemap.xml\"]}" || true
